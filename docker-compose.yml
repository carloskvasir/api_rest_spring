version: '3.8'

services:
  api-livros:
    container_name: api-livros-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: build # Puxa apenas o Estágio 1 (que tem JDK e Maven)
    volumes:
      - ./:/app # Espelha o seu código local para dentro do container
      - maven-cache:/root/.m2 # Cria um volume para salvar dependências sem misturar com sua máquina
    ports:
      - "8000:8080"
    environment:
      - TZ=America/Sao_Paulo
    command: ./mvnw spring-boot:run # Inicia em modo Dev (Live Reload)

volumes:
  maven-cache:
